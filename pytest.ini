[pytest]
markers =
    pgvector: tests that require PostgreSQL with pgvector
    pg_runtime: tests that require PostgreSQL runtime persistence
    pg_jobs: tests that require PostgreSQL report job execution
    pg_control: tests requiring PostgreSQL runtime control tables
    langgraph_recovery: tests requiring PostgreSQL LangGraph crash recovery
    langgraph_review_recovery: tests requiring PostgreSQL durable review recovery
    langgraph_dual_canary: tests requiring PostgreSQL dual-workflow handoff acceptance
    langgraph_single_writer: tests requiring PostgreSQL workflow thread-lock concurrency
    langgraph_fencing: tests requiring PostgreSQL workflow lease fencing
    langgraph_effect_replay: tests requiring PostgreSQL replay-safe provider effects
    langgraph_fencing_canary: tests requiring PostgreSQL Stage 47 fencing-canary gates
    langgraph_heartbeat_recovery: tests requiring PostgreSQL heartbeat ownership-loss recovery
    postgres_capacity: tests requiring PostgreSQL Stage 48 connection-capacity evidence
    real_llm: opt-in smoke tests that call the configured external LLM provider
