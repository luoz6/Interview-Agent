<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帮助 - 面试智能体</title>
    <link rel="stylesheet" href="/static/prototype.css">
</head>
<body class="help-page">
    <header class="app-topbar">
        <a class="app-brand" href="/prep" aria-label="面试智能体首页">
            <span class="app-brand-mark" aria-hidden="true">AI</span>
            <span>面试智能体</span>
        </a>
        <nav class="app-nav" aria-label="主导航">
            <a href="/prep">开始面试</a>
            <a href="/reports">报告中心</a>
            <a href="/help" aria-current="page">帮助</a>
        </nav>
        <div class="app-topbar-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span>使用指南</span>
        </div>
    </header>

    <main class="help-main">
        <header class="help-heading">
            <p class="page-kicker">Product guide</p>
            <h1>帮助</h1>
            <p>按流程完成准备、模拟面试、报告生成和复盘。面试页按 Enter 提交回答，Shift+Enter 换行。</p>
        </header>

        <section class="help-grid" aria-label="常用入口">
            <a href="/prep" class="ui-card help-link">
                <span class="help-link-step" aria-hidden="true">01</span>
                <strong>开始模拟</strong>
                <p>填写 JD 与简历，生成面试计划。</p>
            </a>
            <a href="/reports" class="ui-card help-link">
                <span class="help-link-step" aria-hidden="true">02</span>
                <strong>查看报告</strong>
                <p>进入报告中心查看历史报告与生成状态。</p>
            </a>
            <a href="/prep" class="ui-card help-link">
                <span class="help-link-step" aria-hidden="true">03</span>
                <strong>再次练习</strong>
                <p>重新开始一次新的模拟面试。</p>
            </a>
        </section>
    </main>
</body>
</html>
