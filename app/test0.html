<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告中心 - 面试智能体</title>
    <link rel="stylesheet" href="/static/prototype.css">
</head>
<body class="reports-page">
    <header class="app-topbar">
        <a class="app-brand" href="/prep" aria-label="面试智能体首页">
            <span class="app-brand-mark" aria-hidden="true">AI</span>
            <span>面试智能体</span>
        </a>
        <nav class="app-nav" aria-label="主导航">
            <a href="/prep">开始面试</a>
            <a href="/reports" aria-current="page">报告中心</a>
            <a href="/help">帮助</a>
        </nav>
        <div class="app-topbar-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span>报告归档</span>
        </div>
    </header>

    <main class="reports-main">
        <header class="reports-heading">
            <div>
                <p class="page-kicker">Interview archive</p>
                <h1>报告中心</h1>
                <p>检索历次模拟面试，跟进生成任务并继续下一轮练习。</p>
            </div>
            <div class="reports-heading-actions">
                <button id="refreshReportsButton" type="button" class="ui-button">刷新列表</button>
                <button id="startNewInterviewButton" type="button" class="ui-button ui-button-primary">开始新面试</button>
            </div>
        </header>

        <p id="reportsStatus" class="ui-notice" role="status" aria-live="polite">正在加载报告列表</p>

        <section class="reports-overview" aria-label="报告概览">
            <article class="ui-card report-overview-item">
                <span>全部报告</span>
                <strong id="reportOverviewTotal">--</strong>
            </article>
            <article class="ui-card report-overview-item report-overview-completed">
                <span>已完成</span>
                <strong id="reportOverviewCompleted">--</strong>
            </article>
            <article class="ui-card report-overview-item report-overview-processing">
                <span>生成中</span>
                <strong id="reportOverviewProcessing">--</strong>
            </article>
            <article class="ui-card report-overview-item report-overview-failed">
                <span>生成失败</span>
                <strong id="reportOverviewFailed">--</strong>
            </article>
        </section>

        <div class="reports-layout">
            <aside class="report-filters" aria-label="报告状态筛选">
                <div class="report-filter-heading">
                    <p class="page-kicker">Status</p>
                    <h2>报告状态</h2>
                </div>
                <button class="report-filter" type="button" data-report-status="all" aria-pressed="true">
                    <span>全部</span><strong data-status-count="all">0</strong>
                </button>
                <button class="report-filter" type="button" data-report-status="completed" aria-pressed="false">
                    <span>已完成</span><strong data-status-count="completed">0</strong>
                </button>
                <button class="report-filter" type="button" data-report-status="processing" aria-pressed="false">
                    <span>生成中</span><strong data-status-count="processing">0</strong>
                </button>
                <button class="report-filter" type="button" data-report-status="failed" aria-pressed="false">
                    <span>生成失败</span><strong data-status-count="failed">0</strong>
                </button>
                <p class="report-filter-note">状态统计来自当前加载的真实报告记录。</p>
            </aside>

            <section class="report-table-area" aria-labelledby="reportsTableTitle">
                <div class="report-tools">
                    <div>
                        <p class="page-kicker">Report ledger</p>
                        <h2 id="reportsTableTitle">面试记录</h2>
                    </div>
                    <div class="report-tool-controls">
                        <label class="report-search-label" for="reportSearch">
                            <span class="sr-only">搜索报告</span>
                            <input id="reportSearch" class="report-search" type="search" placeholder="搜索岗位、会话、标签或状态" autocomplete="off">
                        </label>
                        <select id="reportDateFilter" class="report-select" aria-label="日期筛选">
                            <option value="30">最近 30 天</option>
                            <option value="all">全部日期</option>
                        </select>
                    </div>
                </div>

                <div class="ui-card report-table-card">
                    <div class="report-table-scroll">
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th scope="col">面试</th>
                                    <th scope="col">状态</th>
                                    <th scope="col">评分</th>
                                    <th scope="col">时间</th>
                                    <th scope="col">生成路径</th>
                                    <th scope="col">操作</th>
                                </tr>
                            </thead>
                            <tbody id="reportsTableBody"></tbody>
                        </table>
                    </div>
                    <div id="reportsEmptyState" class="empty-state" hidden aria-live="polite"></div>
                    <nav class="pagination" aria-label="报告列表分页">
                        <button id="paginationPrevious" type="button" class="ui-button">上一页</button>
                        <div id="paginationPages" class="pagination-pages"></div>
                        <button id="paginationNext" type="button" class="ui-button">下一页</button>
                    </nav>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="/static/report-center.js"></script>
</body>
</html>
